name: Restore drill do PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: restore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d restore_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RESTORE_TEST_DATABASE_URL: postgresql+psycopg://postgres:restore-test-only@127.0.0.1:5432/restore_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependências
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Backup, verificação e restauração em PostgreSQL temporário
        working-directory: backend
        run: python scripts/disaster_recovery_drill.py
